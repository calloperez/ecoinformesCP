  /* ---------- guardar ---------- */
  async function saveCurrentStudy(patientId, studyId){
    readFieldsIntoStudy();
    currentStudy.mode = expressMode ? 'express' : 'full';
    currentStudy.images = pendingImages;
    currentStudy.descManual = descOverride;
    currentStudy.conclManual = conclOverride;
    /* currentStudy.id ya existe siempre (se genera al abrir el editor, sea estudio
       nuevo o existente — ver openStudyEditor). StudyService.create() escribe a
       IndexedDB al instante (nunca depende de la red) y hace upsert por ese id
       contra Supabase en segundo plano vía SyncEngine: guardar dos, tres o diez
       veces el MISMO estudio siempre pisa el mismo registro, nunca duplica. */
    try{
      const saved = await StudyService.create(patientId, currentStudy);
      if(saved) currentStudy.id = saved.id;
      openPatient(patientId);
    }catch(e){ console.error(e); alert('No se pudo guardar el estudio.\n\n'+e.message); }
  }

  return { init };
})();

/* ---------------- AuthGate ----------------
   Gate simple del lado del cliente: pide una clave antes de arrancar App.init()
   (y por lo tanto antes de que se cargue/muestre cualquier dato de pacientes).
   No es un reemplazo de autenticación real en el backend (la SUPABASE_KEY ya
   viaja en este mismo archivo, visible para cualquiera que lea el código
   fuente) — es un freno para que quien simplemente abra el link del informe,
   o encuentre el link guardado en un dispositivo, no entre a ver ni tocar
   nada sin conocer la clave.

   La clave vigente vive en Supabase (tabla app_settings, protegida por RLS:
   lectura pública del hash, escritura SOLO vía service_role desde
   /api/forgot-password). Al arrancar, se trae ese hash; si no hay conexión
   (primera carga offline), se usa AUTH_HASH_FALLBACK embebido en este archivo
   como respaldo — por eso, si cambiás la clave por consola en vez de por el
   flujo de "olvidé mi clave", conviene actualizar también ese fallback.
   Guarda el desbloqueo en localStorage para no pedirla en cada apertura en
   el mismo dispositivo/navegador.

   Para cambiar la clave a mano (sin el flujo de email): generar el hash
   SHA-256 de la clave nueva, por ejemplo en la consola del navegador:
     crypto.subtle.digest('SHA-256', new TextEncoder().encode('clave nueva'))
       .then(b=>console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')))
   y luego actualizar la fila en Supabase (tabla app_settings, columna
   auth_hash) con ese valor — no alcanza con editar este archivo, porque
   el valor que manda es el que está en Supabase. */
const AUTH_HASH_FALLBACK = '25b214c560294b87dec19823f304382a159c9223af8d8466a8559deeb9eb4d2a'; // clave por defecto: EcoInforme2026 (solo se usa si no hay conexión)
const AUTH_LS_KEY = 'eco_auth_ok_v1';
const AuthGate = (()=>{
  let currentHash = AUTH_HASH_FALLBACK;
  let hashReadyPromise = null;

  async function sha256Hex(str){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  async function fetchCurrentHash(){
    try{
      // cache:'no-store': esta consulta SIEMPRE tiene que pegarle a la red,
      // nunca servirse de una respuesta vieja guardada por el navegador.
      // (Antes se agregaba un parámetro extra "&_=timestamp" para forzar esto,
      // pero Supabase/PostgREST interpreta cualquier parámetro de la URL como
      // un filtro de columna, y como no existe una columna "_", devolvía un
      // error 400 — por eso la clave nueva nunca se leía. cache:'no-store'
      // alcanza por sí solo, sin tocar la URL.)
      const res = await fetch(
        SUPABASE_URL + '/rest/v1/app_settings?id=eq.1&select=auth_hash',
        {
          headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY },
          cache: 'no-store'
        }
      );
      if(!res.ok) return;
      const rows = await res.json();
      if(rows && rows[0] && rows[0].auth_hash) currentHash = rows[0].auth_hash;
    }catch(e){ /* sin red: se usa el fallback embebido */ }
  }
  function startApp(){
    document.getElementById('authGate').style.display = 'none';
    App.init();
  }
  async function attempt(){
    const input = document.getElementById('authInput');
    const err = document.getElementById('authErr');
    const val = input.value || '';
    if(!val){ return; }
    if(hashReadyPromise){ try{ await hashReadyPromise; }catch(e){} } // esperar el hash vigente antes de comparar
    const hash = await sha256Hex(val);
    if(hash === currentHash){
      try{ localStorage.setItem(AUTH_LS_KEY, '1'); }catch(e){}
      startApp();
    } else {
      err.textContent = 'Clave incorrecta';
      input.value = '';
      input.focus();
    }
  }
  async function forgotPassword(){
    const btn = document.getElementById('authForgotBtn');
    const msg = document.getElementById('authForgotMsg');
    btn.disabled = true;
    btn.textContent = 'Enviando...';
    msg.className = 'err';
    msg.textContent = '';
    try{
      const res = await fetch('/api/forgot-password', { method: 'POST' });
      const data = await res.json().catch(()=>({}));
      if(res.ok){
        msg.className = 'err ok-msg';
        msg.textContent = 'Listo, te mandamos la clave nueva por email.';
      } else {
        msg.textContent = data.error || 'No se pudo enviar. Probá de nuevo en un rato.';
      }
    }catch(e){
      msg.textContent = 'Sin conexión: no se pudo pedir la clave nueva.';
    }
    btn.disabled = false;
    btn.textContent = 'Enviar clave nueva por email';
  }
  function init(){
    let already = false;
    try{ already = localStorage.getItem(AUTH_LS_KEY) === '1'; }catch(e){}
    hashReadyPromise = fetchCurrentHash(); // se guarda la promesa: attempt() la espera antes de comparar
    if(already){ startApp(); return; }
    const input = document.getElementById('authInput');
    const btn = document.getElementById('authBtn');
    const forgotLink = document.getElementById('authForgotLink');
    const forgotBox = document.getElementById('authForgotBox');
    const forgotBtn = document.getElementById('authForgotBtn');
    btn.addEventListener('click', attempt);
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') attempt(); });
    forgotLink.addEventListener('click', (e)=>{
      e.preventDefault();
      forgotLink.style.display = 'none';
      forgotBox.style.display = 'block';
    });
    forgotBtn.addEventListener('click', forgotPassword);
    setTimeout(()=> input.focus(), 50);
  }
  return { init };
})();
AuthGate.init();
</script>

<script>
/* Registro del Service Worker (PWA). Defensivo: si falla, la app funciona igual.
   El SW usa estrategia network-first para el HTML, así que una versión nueva
   desplegada (Render/Vercel/etc.) se toma apenas hay conexión (no se queda pegado en caché). */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      try{ reg.update(); }catch(e){}
      /* Si aparece un SW nuevo, se activa de inmediato (skipWaiting en sw.js) */
      reg.addEventListener('updatefound', function(){
        var nw = reg.installing;
        if(nw) nw.addEventListener('statechange', function(){
          if(nw.state==='activated' && navigator.serviceWorker.controller){
            /* Nueva versión lista: no forzamos recarga para no interrumpir una
               carga de informe en curso; se aplicará en la próxima apertura. */
          }
        });
      });
    }).catch(function(){ /* sin SW: la app sigue operando normalmente */ });
  });
}
</script>
